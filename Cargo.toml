[workspace]
members = ["core", "server", "cli", "init"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
krun-sys = "1.10"
libc = "0.2"
thiserror = "2"
smoltcp = { version = "0.13", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }
etherparse = "0.16"
oci-spec = "0.9"
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["fs", "net", "process", "rt-multi-thread", "macros", "io-util", "signal", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
trait-variant = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-util = "0.7"
zstd = "0.13"
url = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release.package.playpencil-init]
opt-level = "z"
codegen-units = 1
strip = true
