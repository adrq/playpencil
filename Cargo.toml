[workspace]
members = ["core", "server", "cli", "init"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
krun-sys = "1.10"
libc = "0.2"
thiserror = "2"
smoltcp = { version = "0.13", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }
etherparse = "0.16"
oci-spec = "0.9"
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["fs", "process", "rt-multi-thread", "macros"] }
tracing = "0.1"
futures-util = "0.3"
zstd = "0.13"
url = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
