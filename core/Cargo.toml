[package]
name = "playpencil-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compute isolation layer — cross-platform VM sandbox for running untrusted code (core)"

[lib]
name = "playpencil_core"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# Test-support constructors for dependent crates' tests.
test-util = []

[dependencies]
pipemux = { git = "https://github.com/adrq/pipemux", tag = "v0.1.0", features = ["relay", "consumer"] }
serde = { workspace = true }
serde_json = { workspace = true }
krun-sys = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
smoltcp = { workspace = true }
etherparse = { workspace = true }
oci-spec = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
zstd = { workspace = true }
url = { workspace = true }
trait-variant = { workspace = true }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
